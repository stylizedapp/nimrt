name: Deploy Docs & Manifest (GitHub Pages)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Nim Docs & Compatibility Portal
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.12'

      - name: Generate Nim API docs
        shell: pwsh
        run: |
          $docRoot = (Resolve-Path src).Path
          nim doc --docRoot:$docRoot --project --index:on --outdir:htmldocs src/corex.nim
          nim doc --docRoot:$docRoot --project --index:on --outdir:htmldocs src/algx.nim
          nim doc --docRoot:$docRoot --project --index:on --outdir:htmldocs src/nimui.nim
          nim doc --docRoot:$docRoot --project --index:on --outdir:htmldocs src/nimui/sdk.nim
          nim buildIndex -o:htmldocs/theindex.html htmldocs

      - name: Generate portal index and compatibility manifest view
        shell: pwsh
        run: nim c -r tools/build_pages.nim

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: htmldocs

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
