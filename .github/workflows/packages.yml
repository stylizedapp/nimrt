name: Publish GitHub Package (GHCR)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'compiler/**'
      - 'src/corex/**'
      - 'src/algx/**'
      - '.github/workflows/packages.yml'
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-ghcr:
    name: Build & Push nimrt-safe OCI Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata & tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/nimrt-safe
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=04.03.03
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push OCI image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke test published container
        run: |
          docker run --rm "ghcr.io/${{ github.repository_owner }}/nimrt-safe:04.03.03" --version
