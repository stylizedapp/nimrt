name: Windows CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  NIM_VERSION: '2.2.12'

jobs:
  test:
    name: Build & Test (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}

      - name: Build QuickJS static library
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tools/build_quickjs.ps1

      - name: Build Hybrid Memory-Safe Compiler (nim_safe)
        shell: pwsh
        run: nimble build_compiler

      - name: Build Release Binaries
        shell: pwsh
        run: nimble build_release

      - name: Run full test suite (nimble test_all)
        shell: pwsh
        run: nimble test_all

      - name: Run algx checked tests (-d:algxChecked)
        shell: pwsh
        run: |
          nim c -d:algxChecked -r tests/test_algx_checked.nim
          nim c -d:algxChecked -r tests/test_ecosystem.nim
          nim c -d:algxChecked -r tests/test_ironclad_heap.nim
          nim c -d:release -d:algxChecked -r tests/test_ironclad_map_stress.nim

      - name: Run UI tests (nimble test_ui)
        shell: pwsh
        run: nimble test_ui

      - name: Run Layout Snapshot & Visual Diff Check
        shell: pwsh
        run: |
          nim c -r tests/test_nimui_layout_snapshots.nim
          nim c -r tests/test_nimui_manifest_golden.nim

      - name: Run QuickJS hybrid tests (nimble test_js)
        shell: pwsh
        run: nimble test_js

      - name: Run Showcase apps headless tests (nimble test_showcase)
        shell: pwsh
        run: nimble test_showcase

      - name: Run nim_safe compiler tests (nimble test_compiler)
        shell: pwsh
        run: nimble test_compiler

  strict-warnings:
    name: Strict Warnings, Nimble Check & Docs
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}

      - name: Validate nimble package
        shell: pwsh
        run: nimble check

      - name: Check corex, algx, and nimui with warnings-as-errors
        shell: pwsh
        run: |
          $strictFlags = @(
            "--hints:on",
            "--warnings:on",
            "--warningAsError[UnusedImport]:on",
            "--hintAsError[XDeclaredButNotUsed]:on"
          )
          nim check @strictFlags src/corex.nim
          nim check @strictFlags src/algx.nim
          nim check @strictFlags src/nimui.nim

      - name: Generate documentation (nim doc)
        shell: pwsh
        run: |
          nim doc --project --index:on --outdir:htmldocs src/corex.nim
          nim doc --project --index:on --outdir:htmldocs src/algx.nim
          nim doc --project --index:on --outdir:htmldocs src/nimui.nim

  ubuntu:
    name: Ubuntu Portability Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}

      - name: Check corex and algx on Linux
        run: |
          nim check src/corex.nim
          nim check src/algx.nim

  canonical-benchmark:
    name: Canonical Benchmark & Release Metrics (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}

      - name: Build QuickJS static library
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tools/build_quickjs.ps1

      - name: Run environment diagnostics (nimble doctor)
        shell: pwsh
        run: nimble doctor

      - name: Build & run canonical benchmark (release headless)
        shell: pwsh
        run: |
          nim c -d:release --opt:speed --nimcache:nimcache/canonical_bench -o:bin/canonical_bench.exe benchmarks/canonical_bench.nim
          ./bin/canonical_bench.exe --headless --json:benchmarks/results/canonical_bench.json --csv:benchmarks/results/canonical_bench.csv

      - name: Measure release binary sizes
        shell: pwsh
        run: |
          nimble build_release
          Get-ChildItem bin/*.exe | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: canonical-benchmark-results
          path: |
            benchmarks/results/canonical_bench.json
            benchmarks/results/canonical_bench.csv
