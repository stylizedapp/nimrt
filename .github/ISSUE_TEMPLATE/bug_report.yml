name: '🐛 Bug Report'
description: 'Report a defect, crash, memory leak, or unexpected behavior in NimRT'
title: '[BUG]: '
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible to help us reproduce and fix it.
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Select which subsystem or application this bug affects.
      options:
        - 'CoreX (Memory, Allocators, IOCP, MFT, Signals)'
        - 'AlgX (UltraSort, FastMap, ZeroPack, SimdScan)'
        - 'NimUI (Layout, Flexbox, Widgets, DSL)'
        - 'NimUI HTML/CSS Engine (Parser, Cascade, Compiler)'
        - 'NimUI Vulkan SDF Backend / Shaders'
        - 'QuickJS Hybrid Bridge & Sandbox'
        - 'nim_safe Compiler & ATF C Checker'
        - 'Showcase Apps (Studio, Desktop, Gallery, Demo, WizTree)'
        - 'Build System / CI / Tooling'
        - 'Other'
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: 'When running nimble studio, tab 3 crashes with...'
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Clear, reproducible steps to trigger the issue.
      placeholder: |
        1. Run `nimble ...`
        2. Execute `...`
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console Output & Crash Logs
      description: Paste any error messages, terminal logs, or backtraces here.
      render: shell
  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: OS version, Nim version, GPU model, and C compiler.
      placeholder: 'Windows 11 x64, Nim 2.2.12, MinGW-W64 GCC 11.1.0, Vulkan 1.1+ (NVIDIA RTX 3060)'
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I verified that this bug occurs on the latest `main` branch.
          required: true
        - label: I checked existing issues to confirm this is not a duplicate.
          required: true
        - label: If this is a leak bug, I tested with `testWithLeakCheck` or `tests/test_leak_check.nim`.
          required: false
