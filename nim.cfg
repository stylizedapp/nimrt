# Nim High-Performance Core Ecosystem Compiler Configuration
# Configures the build pipeline for deterministic ARC/ORC memory management,
# multi-threading, panic handling, and source path resolution.
#
# Note on --path:"apps":
# Currently required because apps/everything/src/search.nim, benchmarks/bench_wiztree.nim,
# and tests/test_{cli,glob,gui_headless,indexer,search,search_speed,usn_sync,wiztree}.nim
# import `everything/...` and `wiztree/...` relative to `apps/`.
# Collision risk: any top-level directory under `apps/` is visible on the global
# import search path, so app folders must not shadow stdlib or `src/` module names.
#
# Note on hints/warnings:
# `--hints:off` keeps local build output concise; CI runs a dedicated strict job with
# `--hints:on --warnings:on --warningAsError[UnusedImport]:on`.

--path:"src"
--path:"apps"
--mm:orc
--threads:on
--panics:on
--hints:off
